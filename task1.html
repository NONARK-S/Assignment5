<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 1 – Turn-based Battle</title>
  <link rel="stylesheet" href="styles.css">
  <script src="task1.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a href="index.html">&larr; Assignment 5</a>
    <h1>Task 1: Turn-based Battle</h1>
  </header>

  <main class="container">
    <div class="layout">
      <div>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <p id="result" class="result" hidden></p>

        <section class="grid" aria-label="Fighters">
          <article id="hero-card" class="card fighter">
            <h2 id="hero-title">Hero</h2>
            <p>HP: <strong id="hero-hp-text"></strong></p>
            <progress id="hero-hp" class="hp" aria-labelledby="hero-title" value="0" max="1"></progress>
            <p>Heals left: <strong id="heals-left"></strong></p>
            <p>Status: <span id="hero-status" class="badge"></span></p>
          </article>

          <article id="enemy-card" class="card fighter">
            <h2 id="enemy-title">Enemy</h2>
            <p>HP: <strong id="enemy-hp-text"></strong></p>
            <progress id="enemy-hp" class="hp" aria-labelledby="enemy-title" value="0" max="1"></progress>
            <p id="enemy-info" class="muted"></p>
          </article>
        </section>

        <section class="card" aria-labelledby="actions-title">
          <h2 id="actions-title">Your move</h2>
          <div id="actions" class="row">
            <button type="button" class="btn btn--primary" data-action="attack">Attack</button>
            <button type="button" class="btn" data-action="defend">Defend</button>
            <button type="button" class="btn" data-action="heal">Heal</button>
            <button type="button" id="restart" class="btn btn--danger">Restart</button>
          </div>
        </section>
      </div>

      <aside>
        <section class="card" aria-labelledby="state-title">
          <h2 id="state-title">Current state</h2>
          <dl class="state-list">
            <dt>Round</dt><dd id="state-round"></dd>
            <dt>Hero HP</dt><dd id="state-hero"></dd>
            <dt>Enemy HP</dt><dd id="state-enemy"></dd>
            <dt>Heals left</dt><dd id="state-heals"></dd>
            <dt>Shield</dt><dd id="state-shield"></dd>
          </dl>
        </section>

        <section class="card" aria-labelledby="log-title">
          <h2 id="log-title">Last 5 actions</h2>
          <ol id="log" class="log"></ol>
          <p id="log-empty" class="empty">No actions yet.</p>
        </section>
      </aside>
    </div>
  </main>
</body>
</html>
